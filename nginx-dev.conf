server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 404;  # Nginx специальный код - закрыть соединение без ответа
    # Или return 404;
}

server {
    listen 80;
    listen [::]:80;

    server_name pwnd.info;

    root /var/www/pwnd.info/dist;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static files caching (dev - shorter)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, no-cache";
        access_log off;
    }



    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name api.pwnd.info www.pwnd.info;

    location / {
        proxy_pass http://127.0.0.1:9112;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

