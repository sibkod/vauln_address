<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} | Wallet Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            background: #0b0d11;
            background-image: radial-gradient(circle at 30% 20%, #171e2c, #05070a 95%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .error-container {
            text-align: center;
            max-width: 500px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: #3b82f6;
            line-height: 1;
            text-shadow: 0 0 60px #3b82f640;
            margin-bottom: 1rem;
        }
        .error-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #f0f4ff;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        p {
            color: #8892b0;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #3b82f6;
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: 0.2s;
            box-shadow: 0 4px 14px #3b82f640;
        }
        .btn:hover {
            background: #4f8df7;
            transform: scale(1.02);
        }
        .btn-secondary {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.2);
            margin-left: 1rem;
        }
        .btn-secondary:hover {
            background: rgba(59, 130, 246, 0.2);
        }
        .error-details {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(18, 24, 36, 0.5);
            border-radius: 1rem;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .error-details code {
            color: #ff6b6b;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 0.85rem;
        }
        .footer {
            position: fixed;
            bottom: 2rem;
            color: #3a4764;
            font-size: 0.75rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">{{.Icon}}</div>
        <div class="error-code">{{.Code}}</div>
        <h1>{{.Title}}</h1>
        <p>{{.Message}}</p>
        <div>
            <a href="/" class="btn">← Back to Home</a>
            {{if .ShowDetails}}
            <a href="/contact" class="btn btn-secondary">Contact Support</a>
            {{end}}
        </div>
        {{if and .ShowDetails .Details}}
        <div class="error-details">
            <code>{{.Details}}</code>
        </div>
        {{end}}
    </div>
    <div class="footer">Wallet Checker © 2026</div>
</body>
</html>
