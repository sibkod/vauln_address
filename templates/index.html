<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet Checker - V Lang + FastHTTP + WebSocket</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        h1 { text-align: center; margin-bottom: 2rem; color: #00d4ff; }
        .card { background: rgba(255,255,255,0.1); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
        .search-box { display: flex; gap: 1rem; margin-bottom: 2rem; }
        input { flex: 1; padding: 1rem; border: 2px solid #00d4ff; border-radius: 8px; background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; }
        button { padding: 1rem 2rem; background: #00d4ff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: #1a1a2e; }
        button:hover { background: #00b8e6; }
        .status { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .stat { flex: 1; text-align: center; padding: 1rem; border-radius: 8px; }
        .stat.hacked { background: rgba(255,0,0,0.3); }
        .stat.vulnerable { background: rgba(255,165,0,0.3); }
        .stat.safe { background: rgba(0,255,0,0.3); }
        .result { font-size: 1.2rem; padding: 1.5rem; border-radius: 8px; margin-top: 1rem; }
        .result.hacked { background: rgba(255,0,0,0.3); border: 2px solid #ff4444; }
        .result.vulnerable { background: rgba(255,165,0,0.3); border: 2px solid #ffa500; }
        .result.safe { background: rgba(0,255,0,0.3); border: 2px solid #44ff44; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { color: #00d4ff; }
        .ws-status { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.connected { background: #44ff44; }
        .dot.disconnected { background: #ff4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wallet Checker</h1>
        <div class="ws-status">
            <div class="dot disconnected" id="wsDot"></div>
            <span>WebSocket: <span id="wsStatus">Disconnected</span></span>
        </div>
        <div class="card">
            <div class="search-box">
                <input type="text" id="address" placeholder="Enter wallet address (e.g., 0x742d35Cc6634C0532925a3b844Bc9e7595f1B2Eb)" />
                <button onclick="checkWallet()">Check</button>
            </div>
            <div id="result" class="result" style="display:none;"></div>
        </div>
        <div class="status">
            <div class="stat hacked">
                <div style="font-size:2rem;font-weight:bold;" id="hacked">-</div>
                <div>Hacked</div>
            </div>
            <div class="stat vulnerable">
                <div style="font-size:2rem;font-weight:bold;" id="vulnerable">-</div>
                <div>Vulnerable</div>
            </div>
            <div class="stat safe">
                <div style="font-size:2rem;font-weight:bold;" id="safe">-</div>
                <div>Safe</div>
            </div>
        </div>
        <div class="card">
            <h3>Demo Wallets (click to check)</h3>
            <table>
                <thead><tr><th>Address</th><th>Status</th><th>Balance</th></tr></thead>
                <tbody id="wallets"></tbody>
            </table>
        </div>
        <div class="card">
            <h3>Rate Limit</h3>
            <p>Remaining checks: <span id="rateLimit">-</span> / 3</p>
        </div>
    </div>
    <script>
        // WebSocket connection - all data comes through WebSocket
        const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
        const wsPort = 8081;
        const ws = new WebSocket(wsProtocol + "//" + location.hostname + ":" + wsPort + "/ws");
        
        ws.onopen = function() {
            document.getElementById("wsDot").className = "dot connected";
            document.getElementById("wsStatus").textContent = "Connected";
            // Request initial data via WebSocket
            ws.send(JSON.stringify({type: "get_stats"}));
            ws.send(JSON.stringify({type: "get_wallets"}));
            ws.send(JSON.stringify({type: "get_rate_limit"}));
        };
        
        ws.onclose = function() {
            document.getElementById("wsDot").className = "dot disconnected";
            document.getElementById("wsStatus").textContent = "Disconnected";
            // Reconnect after 3 seconds
            setTimeout(function() { location.reload(); }, 3000);
        };
        
        ws.onerror = function() {
            document.getElementById("wsStatus").textContent = "Error";
        };
        
        ws.onmessage = function(e) {
            const data = JSON.parse(e.data);
            if (data.type === "wallet_result") {
                showResult(data.wallet);
                if (data.remaining !== undefined) {
                    document.getElementById("rateLimit").textContent = data.remaining;
                }
            } else if (data.type === "stats") {
                document.getElementById("hacked").textContent = data.hacked;
                document.getElementById("vulnerable").textContent = data.vulnerable;
                document.getElementById("safe").textContent = data.safe;
            } else if (data.type === "rate_limit") {
                document.getElementById("rateLimit").textContent = data.remaining;
            } else if (data.type === "wallets") {
                const tbody = document.getElementById("wallets");
                tbody.innerHTML = "";
                data.wallets.forEach(function(w) {
                    const row = tbody.insertRow();
                    row.innerHTML = "<td>" + w.address.substring(0,10) + "..." + w.address.slice(-6) + "</td><td>" + w.status + "</td><td>" + w.balance + "</td>";
                    row.style.cursor = "pointer";
                    row.onclick = function() { 
                        document.getElementById("address").value = w.address; 
                        checkWallet(); 
                    };
                });
            } else if (data.type === "error") {
                alert("Error: " + data.message);
            } else if (data.type === "pong") {
                // Heartbeat response
            }
        };
        
        function checkWallet() {
            const addr = document.getElementById("address").value.trim();
            if (!addr) return;
            ws.send(JSON.stringify({type: "check_wallet", address: addr}));
        }
        
        function showResult(wallet) {
            const el = document.getElementById("result");
            el.style.display = "block";
            el.className = "result " + wallet.status;
            el.innerHTML = "<strong>" + wallet.status.toUpperCase() + "</strong><br>Address: " + wallet.address + "<br>Balance: " + wallet.balance + " ETH<br>Tokens: " + wallet.tokens + "<br>Source: " + wallet.source;
        }
        
        document.getElementById("address").addEventListener("keypress", function(e) {
            if (e.key === "Enter") checkWallet();
        });
        
        // Heartbeat every 30 seconds
        setInterval(function() {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({type: "ping"}));
            }
        }, 30000);
    </script>
</body>
</html>
