{{define "content"}}
<style>
.error-page { text-align: center; padding: 4rem 2rem; }
.error-code { font-size: 6rem; font-weight: bold; color: #f00; margin-bottom: 1rem; }
.error-title { font-size: 1.5rem; margin-bottom: 1rem; }
.error-msg { color: #088; margin-bottom: 2rem; }
</style>

<div class="error-page">
    <div class="error-code">{{.Code}}</div>
    <h1 class="error-title">ERROR</h1>
    <p class="error-msg">{{.Message}}</p>
    <a href="/" class="btn">GO HOME</a>
</div>
{{end}}
