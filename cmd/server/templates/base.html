<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} | WalletChecker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #000;
            --fg: #0ff;
            --fg-dim: #088;
            --border: #0ff;
            --error: #f00;
        }
        
        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        a { color: var(--fg); text-decoration: none; }
        a:hover { text-decoration: underline; }
        
        /* NAV */
        nav {
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .brand {
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 0.1em;
        }
        
        .brand::before { content: '['; color: var(--fg-dim); }
        .brand::after { content: ']'; color: var(--fg-dim); }
        
        .nav-links {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        
        .nav-link {
            padding: 0.4rem 0.8rem;
            border: 1px solid transparent;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        .nav-link:hover, .nav-link.active {
            border-color: var(--border);
            text-decoration: none;
        }
        
        /* MAIN */
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        
        h2 { font-size: 1.1rem; margin-bottom: 1rem; }
        h3 { font-size: 1rem; color: var(--fg-dim); margin-bottom: 0.5rem; }
        p { margin-bottom: 1rem; color: #088; }
        
        /* BUTTONS */
        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--fg);
            font-family: inherit;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: var(--fg);
            color: var(--bg);
        }
        
        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .btn:disabled:hover {
            background: transparent;
            color: var(--fg);
        }
        
        /* INPUTS */
        input, textarea, select {
            background: var(--bg);
            border: 1px solid var(--fg);
            color: var(--fg);
            padding: 0.6rem;
            font-family: inherit;
            font-size: 0.9rem;
            width: 100%;
            margin-bottom: 1rem;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 1px var(--fg);
        }
        
        /* CARDS */
        .card {
            border: 1px solid var(--border);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            font-size: 0.8rem;
            color: var(--fg-dim);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        /* TABLES */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }
        
        th, td {
            text-align: left;
            padding: 0.6rem;
            border: 1px solid #222;
        }
        
        th {
            color: var(--fg-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
        }
        
        /* STATUS BADGES */
        .status {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            border: 1px solid;
        }
        
        .status-hacked { border-color: var(--error); color: var(--error); }
        .status-safe { border-color: #0f0; color: #0f0; }
        .status-vulnerable { border-color: #ff0; color: #ff0; }
        
        /* FOOTER */
        footer {
            border-top: 1px solid var(--border);
            padding: 1rem 2rem;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: var(--fg-dim);
            text-align: center;
        }
        
        /* GRID */
        .grid {
            display: grid;
            gap: 1.5rem;
        }
        
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
        
        /* MOBILE */
        @media (max-width: 600px) {
            nav { flex-direction: column; padding: 1rem; }
            main { padding: 1rem; }
            .nav-links { width: 100%; justify-content: center; }
        }
        
        /* TOAST */
        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 0.8rem 1.5rem;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }
        #toast.show { opacity: 1; }
        
        /* CODE */
        code {
            background: #111;
            padding: 0.1rem 0.3rem;
            font-size: 0.85em;
        }
        
        pre {
            background: #111;
            padding: 1rem;
            overflow-x: auto;
            border: 1px solid #222;
            margin-bottom: 1rem;
        }
        
        pre code {
            background: none;
            padding: 0;
        }
        
        /* UTILS */
        .text-dim { color: var(--fg-dim); }
        .text-error { color: var(--error); }
        .text-success { color: #0f0; }
        .mb-0 { margin-bottom: 0; }
        .mb-1 { margin-bottom: 0.5rem; }
        .mb-2 { margin-bottom: 1rem; }
        .mb-3 { margin-bottom: 1.5rem; }
    </style>
</head>
<body>
    <div id="toast"></div>

    <nav>
        <a href="/" class="brand">WALLET_CHECKER</a>
        <div class="nav-links">
            <a href="/" class="nav-link {{if eq .ActivePage "home"}}active{{end}}">HOME</a>
            <a href="/roadmap" class="nav-link {{if eq .ActivePage "roadmap"}}active{{end}}">ROADMAP</a>
            <a href="/about" class="nav-link {{if eq .ActivePage "about"}}active{{end}}">ABOUT</a>
            <a href="/support" class="nav-link {{if eq .ActivePage "support"}}active{{end}}">BUY</a>
            {{if .IsAuthenticated}}
            <a href="/api-keys" class="nav-link {{if eq .ActivePage "api-keys"}}active{{end}}">API</a>
            {{end}}
        </div>
        <div>
            <button class="btn" id="connectBtn" onclick="connectWallet()">CONNECT</button>
        </div>
    </nav>

    <main>
        {{.Content}}
    </main>

    <footer>
        WALLET_CHECKER v1.0 // WITHOUT SEED PHRASES STORED
    </footer>

<script>
// ========== WALLET ==========
const SERVER_AUTH = {{.IsAuthenticated}};
const SERVER_ADDRESS = "{{.UserAddress}}";
let authToken = localStorage.getItem('authToken') || '';
let connectedAddress = localStorage.getItem('walletAddress') || '';
let isWalletConnected = false;
let serverAuthenticated = SERVER_AUTH;
let userBalance = {{.UserBalance}};

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function getSolanaProvider() {
    if (window.solana && window.solana.isConnected) return window.solana;
    if (window.solana && window.solana.isPhantom) return window.solana;
    return null;
}

function updateConnectUI() {
    const btn = document.getElementById('connectBtn');
    if (serverAuthenticated && connectedAddress) {
        btn.textContent = connectedAddress.slice(0, 6) + '...';
        btn.onclick = () => logout();
    } else {
        btn.textContent = 'CONNECT';
        btn.onclick = () => connectWallet();
    }
}

async function connectWallet() {
    const provider = getSolanaProvider();
    if (!provider) {
        showToast('Install Phantom wallet first');
        return;
    }
    try {
        const resp = await provider.connect();
        connectedAddress = resp.publicKey.toString();
        localStorage.setItem('walletAddress', connectedAddress);
        isWalletConnected = true;
        
        // Auth with backend
        const nonceRes = await fetch('/api/auth/nonce?address=' + connectedAddress + '&chain=solana');
        const { message } = await nonceRes.json();
        const encoder = new TextEncoder();
        const sig = await provider.signMessage(encoder.encode(message));
        const sigHex = Array.from(sig.signature).map(b => b.toString(16).padStart(2,'0')).join('');
        
        const loginRes = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ address: connectedAddress, signature: sigHex, message, chain: 'solana' })
        });
        const loginData = await loginRes.json();
        if (loginData.token) {
            authToken = loginData.token;
            localStorage.setItem('authToken', authToken);
            serverAuthenticated = true;
            userBalance = loginData.user?.balance || 0;
        }
        updateConnectUI();
        showToast('Connected: ' + connectedAddress.slice(0, 8) + '...');
    } catch (e) {
        showToast('Error: ' + e.message);
    }
}

function logout() {
    localStorage.removeItem('walletAddress');
    localStorage.removeItem('authToken');
    connectedAddress = '';
    authToken = '';
    isWalletConnected = false;
    serverAuthenticated = false;
    updateConnectUI();
    showToast('Disconnected');
}

// Init
updateConnectUI();
if (connectedAddress && window.solana?.isConnected) {
    isWalletConnected = true;
    updateConnectUI();
}

window.showToast = showToast;
window.connectWallet = connectWallet;
window.logout = logout;
window.getAuthToken = () => authToken;
window.isAuthenticated = () => serverAuthenticated;
</script>
</body>
</html>
