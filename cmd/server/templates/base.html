<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{.Title}} | Wallet Checker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { min-height: 100vh; background: #0b0d11; background-image: radial-gradient(circle at 30% 20%, #171e2c, #05070a 95%); display: flex; flex-direction: column; align-items: center; padding: 0; }

        .nav { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 2rem; background: rgba(10, 14, 22, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.04); flex-wrap: wrap; gap: 0.5rem; position: sticky; top: 0; z-index: 50; }
        .nav-brand { color: #f0f4ff; font-weight: 600; font-size: 1.2rem; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.5rem; }
        .nav-brand span { color: #3b82f6; }
        .nav-center { display: flex; align-items: center; gap: 0.3rem; background: rgba(18, 24, 36, 0.5); padding: 0.2rem; border-radius: 60px; border: 1px solid rgba(255,255,255,0.04); }
        .nav-link { padding: 0.45rem 1.2rem; border-radius: 40px; color: #8892b0; font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: 0.2s; border: none; background: transparent; letter-spacing: 0.01em; white-space: nowrap; text-decoration: none; }
        .nav-link:hover { color: #c8d2e8; }
        .nav-link.active { background: #3b82f6; color: white; box-shadow: 0 2px 12px #3b82f640; }
        .nav-right { display: flex; align-items: center; gap: 0.5rem; }
        .user-btn { background: rgba(26, 34, 50, 0.7); border: 1px solid rgba(255,255,255,0.06); color: #e8edfc; padding: 0.5rem 1.2rem 0.5rem 1rem; border-radius: 60px; font-weight: 500; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; transition: 0.2s; }
        .user-btn:hover { background: rgba(40, 50, 70, 0.8); border-color: rgba(255,255,255,0.12); }
        .user-btn .dot { width: 8px; height: 8px; border-radius: 10px; background: #4f5b77; display: inline-block; transition: 0.2s; }
        .user-btn .dot.active { background: #34d399; box-shadow: 0 0 10px #34d39960; }
        .user-btn .email-short { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 400; color: #b0bbd6; font-size: 0.8rem; }

        .main-content { width: 100%; max-width: 700px; padding: 1.5rem 1.5rem 2rem; }

        .footer { margin-top: 2rem; color: #3a4764; font-size: 0.75rem; letter-spacing: 0.02em; display: flex; justify-content: center; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
        .footer span { color: #5f6e91; }
        .footer .counter { background: #181f30; padding: 0.15rem 0.9rem; border-radius: 40px; font-size: 0.7rem; color: #9aabcf; }

        .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%); background: #1a2135; color: #e3e9fc; padding: 0.8rem 1.8rem; border-radius: 60px; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 8px 30px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; z-index: 999; backdrop-filter: blur(8px); }
        .toast.show { opacity: 1; }

        /* Auth Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-overlay.hidden { display: none; }
        .modal { background: #1a2135; border-radius: 16px; padding: 2rem; width: 90%; max-width: 400px; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .modal h2 { color: #f0f4ff; margin-bottom: 1.5rem; text-align: center; }
        .modal .close-btn { position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #8892b0; cursor: pointer; font-size: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; color: #8892b0; font-size: 0.85rem; margin-bottom: 0.5rem; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: #141825; color: #f0f4ff; font-size: 0.95rem; }
        .form-group input:focus { outline: none; border-color: #3b82f6; }
        .btn-primary { width: 100%; padding: 0.75rem; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: 500; cursor: pointer; font-size: 0.95rem; transition: 0.2s; }
        .btn-primary:hover { background: #2563eb; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .modal-footer { text-align: center; margin-top: 1rem; color: #8892b0; font-size: 0.85rem; }
        .modal-footer a { color: #3b82f6; cursor: pointer; text-decoration: none; }
        .modal-footer a:hover { text-decoration: underline; }
        .error-text { color: #ef4444; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; display: none; }
        .error-text.show { display: block; }

        @media (max-width: 768px) {
            .nav { flex-direction: column; padding: 0.6rem 1rem; }
            .nav-center { flex-wrap: wrap; justify-content: center; border-radius: 60px; padding: 0.2rem 0.4rem; }
            .nav-link { padding: 0.35rem 0.8rem; font-size: 0.7rem; }
            .nav-right { width: 100%; justify-content: center; }
            .main-content { padding: 1rem; }
        }
    </style>
</head>
<body>
<div class="toast" id="toast"></div>

<!-- Auth Modal -->
<div class="modal-overlay hidden" id="authModal">
    <div class="modal">
        <h2 id="modalTitle">Sign In</h2>
        <form id="authForm">
            <div class="form-group" id="nameGroup" style="display: none;">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Your name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min 8 characters" required>
            </div>
            <p class="error-text" id="authError"></p>
            <button type="submit" class="btn-primary" id="authSubmitBtn">Sign In</button>
        </form>
        <div class="modal-footer">
            <span id="modalFooterText">Don't have an account? <a id="toggleAuthMode">Sign up</a></span>
        </div>
    </div>
</div>

<nav class="nav">
    <a href="/" class="nav-brand">🔐 <span>Wallet</span>Checker</a>
    <div class="nav-center">
        <a href="/" class="nav-link {{if eq .ActivePage "home"}}active{{end}}">Home</a>
        <a href="/roadmap" class="nav-link {{if eq .ActivePage "roadmap"}}active{{end}}">🗺️ Roadmap</a>
        <a href="/about" class="nav-link {{if eq .ActivePage "about"}}active{{end}}">About</a>
        {{if .IsAuthenticated}}
        <a href="/api-docs" class="nav-link {{if eq .ActivePage "api"}}active{{end}}">🔌 API</a>
        {{end}}
        <a href="/support" class="nav-link {{if eq .ActivePage "support"}}active{{end}}">💎 Buy</a>
    </div>
    <div class="nav-right">
        <button class="user-btn" id="userBtn">
            <span class="dot" id="userDot"></span>
            <span id="userLabel">Sign In</span>
            <span class="email-short" id="userEmailShort"></span>
        </button>
        <button class="nav-link" id="logoutBtn" style="display: none;" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="main-content">
    {{.Content}}
</div>

<div class="footer">
    <span>⚡ Without login — <span id="freeLimitDisplay">{{.FreeCheckLimit}}</span> check{{if ne .FreeCheckLimit 1}}s{{end}}</span>
    <span class="counter" id="checkCounter">0 / {{.FreeCheckLimit}}</span>
</div>

<script>
(function() {
    const SERVER_AUTH = {{if .IsAuthenticated}}true{{else}}false{{end}};
    const SERVER_EMAIL = "{{.UserEmail}}";
    const FREE_CHECK_LIMIT = {{.FreeCheckLimit}};
    const freeLimitDisplay = document.getElementById('freeLimitDisplay');
    if (freeLimitDisplay) freeLimitDisplay.textContent = FREE_CHECK_LIMIT;

    let freeCheckUsed = localStorage.getItem('freeCheckUsed') === 'true';
    let authToken = localStorage.getItem('authToken');
    let serverAuthenticated = SERVER_AUTH;
    let userEmail = SERVER_EMAIL;
    let userBalance = {{.UserBalance}};
    let isLoginMode = true;

    const userBtn = document.getElementById('userBtn');
    const userDot = document.getElementById('userDot');
    const userLabel = document.getElementById('userLabel');
    const userEmailShort = document.getElementById('userEmailShort');
    const logoutBtn = document.getElementById('logoutBtn');
    const checkCounter = document.getElementById('checkCounter');
    const toast = document.getElementById('toast');
    const authModal = document.getElementById('authModal');
    const authForm = document.getElementById('authForm');
    const modalTitle = document.getElementById('modalTitle');
    const modalFooterText = document.getElementById('modalFooterText');
    const toggleAuthMode = document.getElementById('toggleAuthMode');
    const authSubmitBtn = document.getElementById('authSubmitBtn');
    const authError = document.getElementById('authError');

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function updateUserUI() {
        if (serverAuthenticated && userEmail) {
            userDot.className = 'dot active';
            userLabel.textContent = '';
            const emailShort = userEmail.split('@')[0];
            userEmailShort.textContent = emailShort.length > 12 ? emailShort.slice(0, 12) + '...' : emailShort;
            logoutBtn.style.display = 'inline-block';
        } else {
            userDot.className = 'dot';
            userLabel.textContent = 'Sign In';
            userEmailShort.textContent = '';
            logoutBtn.style.display = 'none';
        }
    }

    function updateCounter() {
        if (serverAuthenticated) {
            checkCounter.textContent = userBalance + ' credits';
        } else {
            const remaining = freeCheckUsed ? 0 : FREE_CHECK_LIMIT;
            checkCounter.textContent = remaining + ' / ' + FREE_CHECK_LIMIT;
        }
    }

    function showAuthModal() {
        authModal.classList.remove('hidden');
        authError.classList.remove('show');
        authError.textContent = '';
        document.getElementById('email').value = '';
        document.getElementById('password').value = '';
    }

    function hideAuthModal() {
        authModal.classList.add('hidden');
    }

    function toggleMode() {
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            modalTitle.textContent = 'Sign In';
            authSubmitBtn.textContent = 'Sign In';
            modalFooterText.innerHTML = 'Don\'t have an account? <a id="toggleAuthMode">Sign up</a>';
        } else {
            modalTitle.textContent = 'Sign Up';
            authSubmitBtn.textContent = 'Sign Up';
            modalFooterText.innerHTML = 'Already have an account? <a id="toggleAuthMode">Sign in</a></a>';
        }
        document.getElementById('toggleAuthMode').addEventListener('click', toggleMode);
        authError.classList.remove('show');
    }

    async function performAuth() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) {
            authError.textContent = 'Please fill in all fields';
            authError.classList.add('show');
            return;
        }

        if (password.length < 8) {
            authError.textContent = 'Password must be at least 8 characters';
            authError.classList.add('show');
            return;
        }

        authSubmitBtn.disabled = true;
        authSubmitBtn.textContent = isLoginMode ? 'Signing in...' : 'Creating account...';

        try {
            const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            
            const data = await res.json();

            if (res.ok && data.token) {
                authToken = data.token;
                localStorage.setItem('authToken', authToken);
                serverAuthenticated = true;
                userEmail = data.user.email;
                userBalance = data.user.balance || 0;
                hideAuthModal();
                updateUserUI();
                updateCounter();
                showToast(isLoginMode ? '✅ Welcome back!' : '✅ Account created!');
                document.dispatchEvent(new CustomEvent('userAuthenticated'));
            } else {
                authError.textContent = data.error || data.details || 'Authentication failed';
                authError.classList.add('show');
            }
        } catch (error) {
            authError.textContent = 'Network error. Please try again.';
            authError.classList.add('show');
        } finally {
            authSubmitBtn.disabled = false;
            authSubmitBtn.textContent = isLoginMode ? 'Sign In' : 'Sign Up';
        }
    }

    // Validate session with backend
    async function validateSession() {
        if (!authToken) {
            return false;
        }
        
        try {
            const res = await fetch('/api/user/profile', {
                headers: { 'Authorization': 'Bearer ' + authToken }
            });
            
            if (res.ok) {
                const data = await res.json();
                userBalance = data.user ? data.user.balance : 0;
                return true;
            } else {
                clearAuthData();
                return false;
            }
        } catch (error) {
            console.error('Session validation failed:', error);
            return false;
        }
    }

    function clearAuthData() {
        localStorage.removeItem('authToken');
        authToken = null;
        serverAuthenticated = false;
        userEmail = '';
        userBalance = 0;
    }

    window.logout = async function() {
        clearAuthData();
        localStorage.removeItem('freeCheckUsed');
        freeCheckUsed = false;
        updateUserUI();
        updateCounter();
        showToast('👋 Signed out');
    };

    // Restore state
    async function restoreState() {
        if (SERVER_AUTH && authToken) {
            const valid = await validateSession();
            if (!valid) {
                clearAuthData();
            }
        } else if (authToken && !SERVER_AUTH) {
            clearAuthData();
        }
    }

    userBtn.addEventListener('click', function() {
        if (serverAuthenticated) return;
        isLoginMode = true;
        modalTitle.textContent = 'Sign In';
        authSubmitBtn.textContent = 'Sign In';
        modalFooterText.innerHTML = 'Don\'t have an account? <a id="toggleAuthMode">Sign up</a>';
        document.getElementById('toggleAuthMode').addEventListener('click', toggleMode);
        showAuthModal();
    });

    authForm.addEventListener('submit', function(e) {
        e.preventDefault();
        performAuth();
    });

    // Close modal on overlay click
    authModal.addEventListener('click', function(e) {
        if (e.target === authModal) {
            hideAuthModal();
        }
    });

    // Initialize
    restoreState().then(() => {
        updateUserUI();
        updateCounter();
    });

    // Re-export for pages
    window.showToast = showToast;
    window.updateCounter = updateCounter;
    window.setFreeCheckUsed = function(v) { 
        freeCheckUsed = v; 
        localStorage.setItem('freeCheckUsed', v ? 'true' : 'false');
        updateCounter();
    };
    window.getFreeCheckUsed = function() { return freeCheckUsed; };
    window.getAuthToken = function() { return authToken; };
    window.isAuthenticated = function() { return serverAuthenticated; };
    window.getUserBalance = function() { return userBalance; };
})();
</script>
</body>
</html>
