{{define "content"}}
<style>
.key-item { background: #111; padding: 1rem; margin-bottom: 1rem; border: 1px solid #222; }
.key-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
.key-prefix { font-family: monospace; color: #0ff; }
.key-meta { font-size: 0.8rem; color: #088; }
.api-form { display: grid; gap: 1rem; }
</style>

<h1>// API KEYS</h1>
<p class="text-dim mb-3">Manage your API keys for programmatic access.</p>

{{if not .IsAuthenticated}}
<div class="card">
    <p>Connect your wallet to manage API keys.</p>
    <button class="btn" onclick="connectWallet()">CONNECT</button>
</div>
{{else}}
<div class="card mb-2">
    <div class="card-header">CREATE NEW KEY</div>
    <form id="createKeyForm" class="api-form">
        <input type="text" id="keyName" placeholder="Key name (e.g., 'Production')" required>
        <div style="display: flex; gap: 1rem;">
            <select id="expiresIn" style="width: auto;">
                <option value="0">Never expires</option>
                <option value="30">30 days</option>
                <option value="90">90 days</option>
                <option value="365">1 year</option>
            </select>
            <button type="submit" class="btn">CREATE</button>
        </div>
    </form>
</div>

<div id="keysList"></div>
<div id="newKeyModal" style="display: none;" class="card">
    <div class="card-header">NEW API KEY</div>
    <p class="text-error mb-1">Save this now! It will not be shown again.</p>
    <pre id="newKeyValue" style="word-break: break-all;"></pre>
    <button class="btn" onclick="closeNewKeyModal()">CLOSE</button>
</div>
{{end}}

<script>
async function loadKeys() {
    const res = await fetch('/api/api-keys', {
        headers: { 'Authorization': 'Bearer ' + window.getAuthToken() }
    });
    const data = await res.json();
    
    if (data.keys && data.keys.length > 0) {
        document.getElementById('keysList').innerHTML = data.keys.map(k => `
            <div class="key-item">
                <div class="key-header">
                    <span class="key-prefix">${k.key_prefix}***</span>
                    <span>${k.is_revoked ? '<span class="text-error">REVOKED</span>' : '<span class="text-success">ACTIVE</span>'}</span>
                </div>
                <div class="key-meta">
                    ${k.name} | Created: ${new Date(k.created_at).toLocaleDateString()}
                    ${k.expires_at ? ' | Expires: ' + new Date(k.expires_at).toLocaleDateString() : ''}
                </div>
                ${!k.is_revoked ? `<button class="btn" onclick="revokeKey(${k.id})" style="margin-top: 0.5rem;">REVOKE</button>` : ''}
            </div>
        `).join('');
    } else {
        document.getElementById('keysList').innerHTML = '<p class="text-dim">No API keys yet.</p>';
    }
}

async function createKey(e) {
    e.preventDefault();
    const name = document.getElementById('keyName').value;
    const expiresIn = parseInt(document.getElementById('expiresIn').value);
    
    const res = await fetch('/api/api-keys', {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + window.getAuthToken()
        },
        body: JSON.stringify({ name, expires_in: expiresIn })
    });
    
    const data = await res.json();
    if (data.api_key) {
        document.getElementById('newKeyValue').textContent = data.api_key;
        document.getElementById('newKeyModal').style.display = 'block';
        document.getElementById('createKeyForm').reset();
    } else {
        alert('Error: ' + (data.error || 'Failed'));
    }
}

function closeNewKeyModal() {
    document.getElementById('newKeyModal').style.display = 'none';
}

async function revokeKey(id) {
    if (!confirm('Revoke this key?')) return;
    await fetch('/api/api-keys/revoke/' + id, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + window.getAuthToken() }
    });
    loadKeys();
}

document.getElementById('createKeyForm')?.addEventListener('submit', createKey);
if (document.getElementById('keysList')) loadKeys();
</script>
{{end}}
