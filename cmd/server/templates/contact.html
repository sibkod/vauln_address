{{define "content"}}
<h1>// CONTACT</h1>
<p class="text-dim mb-3">Send us a message.</p>

<div class="card">
    <form id="contactForm">
        <label class="text-dim mb-1" style="display: block;">Name</label>
        <input type="text" id="name" required placeholder="Your name">
        
        <label class="text-dim mb-1" style="display: block;">Email</label>
        <input type="email" id="email" required placeholder="your@email.com">
        
        <label class="text-dim mb-1" style="display: block;">Message</label>
        <textarea id="message" rows="5" required placeholder="Your message..."></textarea>
        
        <button type="submit" class="btn">SEND</button>
    </form>
    <div id="result" style="margin-top: 1rem;"></div>
</div>

<script>
document.getElementById('contactForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    btn.textContent = 'SENDING...';
    
    try {
        const res = await fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                message: document.getElementById('message').value
            })
        });
        
        if (res.ok) {
            document.getElementById('result').innerHTML = '<p class="text-success">Message sent!</p>';
            e.target.reset();
        } else {
            const data = await res.json();
            document.getElementById('result').innerHTML = '<p class="text-error">Error: ' + (data.error || 'Failed') + '</p>';
        }
    } catch {
        document.getElementById('result').innerHTML = '<p class="text-error">Request failed</p>';
    }
    
    btn.disabled = false;
    btn.textContent = 'SEND';
});
</script>
{{end}}
