<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vauln Address - Проверка криптокошельков</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a25;
            --border: #2a2a3a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --safe: #22c55e;
            --safe-bg: rgba(34, 197, 94, 0.1);
            --info: #3b82f6;
            --info-bg: rgba(59, 130, 246, 0.1);
            --purple: #a855f7;
            --purple-bg: rgba(168, 85, 247, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        header {
            text-align: center;
            padding: 3rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .tagline { color: var(--text-secondary); font-size: 1.1rem; }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .card-title svg { width: 24px; height: 24px; color: var(--accent); }

        .form-group { margin-bottom: 1.5rem; }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        select, input, textarea {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        select:focus, input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        textarea { min-height: 100px; resize: vertical; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-secondary { background: var(--bg-secondary); border: 1px solid var(--border); }
        .btn-secondary:hover { box-shadow: none; }

        .btn svg { width: 20px; height: 20px; }

        .result {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 12px;
            display: none;
            background: var(--bg-secondary);
        }

        .result.show { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-hacked { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
        .status-vulnerable { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning); }
        .status-safe { background: var(--safe-bg); color: var(--safe); border: 1px solid var(--safe); }
        .status-hacker { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple); }
        .status-drained { background: var(--info-bg); color: var(--info); border: 1px solid var(--info); }
        .status-not_found { background: var(--bg-card); color: var(--text-secondary); border: 1px solid var(--border); }

        .result-details { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .detail-item { background: var(--bg-primary); padding: 1rem; border-radius: 8px; }

        .detail-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .detail-value { font-size: 0.9rem; font-weight: 500; word-break: break-all; }
        .detail-value.yes { color: var(--danger); }
        .detail-value.no { color: var(--safe); }

        .user-panel {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .user-panel.show { display: block; }

        .user-info { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
        .user-address { font-family: monospace; font-size: 0.9rem; }
        .user-balance { text-align: right; }
        .balance-number { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
        .balance-label { font-size: 0.75rem; color: var(--text-secondary); }

        .pricing-section { margin-top: 2rem; }
        .pricing-grid { display: grid; gap: 0.75rem; margin-top: 1rem; }
        
        .pricing-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pricing-item.sui { border-color: var(--purple); background: var(--purple-bg); }
        .pricing-item.sui .discount { background: var(--purple); color: white; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }

        .pricing-currency { font-weight: 600; text-transform: uppercase; }
        .pricing-price { font-family: monospace; }
        .pricing-discount { color: var(--safe); font-size: 0.8rem; }

        .recent-section { margin-top: 3rem; }
        .section-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
        .section-title svg { width: 28px; height: 28px; color: var(--danger); }

        .recent-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1rem; }

        .recent-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s;
        }

        .recent-item:hover { border-color: var(--accent); transform: translateX(5px); }

        .recent-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .recent-icon.hacked { background: var(--danger-bg); color: var(--danger); }
        .recent-icon.vulnerable { background: var(--warning-bg); color: var(--warning); }
        .recent-icon.hacker { background: var(--purple-bg); color: var(--purple); }

        .recent-info { flex: 1; min-width: 0; }
        .recent-address { font-family: monospace; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 0.25rem; }
        .recent-meta { font-size: 0.75rem; color: var(--text-secondary); }

        .recent-status {
            padding: 0.25rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .recent-status.hacked { background: var(--danger-bg); color: var(--danger); }
        .recent-status.vulnerable { background: var(--warning-bg); color: var(--warning); }
        .recent-status.hacker { background: var(--purple-bg); color: var(--purple); }

        .error-message {
            background: var(--danger-bg);
            color: var(--danger);
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
            display: none;
        }
        .error-message.show { display: block; }

        .contact-success {
            background: var(--safe-bg);
            color: var(--safe);
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
            display: none;
            margin-top: 1rem;
        }
        .contact-success.show { display: block; }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            text-align: center;
            padding: 3rem 0;
            margin-top: 3rem;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.875rem;
        }
        .footer a { color: var(--accent); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show { display: flex; }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🔒 Vauln Address</div>
            <p class="tagline">Проверка безопасности криптокошельков в разных блокчейнах</p>
        </header>

        <div class="main-grid">
            <div class="card">
                <h2 class="card-title">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    Проверить кошелек
                </h2>

                <div class="user-panel" id="userPanel">
                    <div class="user-info">
                        <div>
                            <div class="user-address" id="userAddress">-</div>
                            <div style="font-size: 0.75rem; color: var(--text-secondary);" id="userChain">-</div>
                        </div>
                        <div class="user-balance">
                            <div class="balance-number" id="userBalance">0</div>
                            <div class="balance-label">проверок</div>
                        </div>
                    </div>
                </div>

                <button class="btn btn-secondary" id="connectWalletBtn" onclick="connectWallet()">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                    Подключить кошелек
                </button>

                <form id="checkForm" style="margin-top: 1.5rem;">
                    <div class="form-group">
                        <label for="chain">Сеть</label>
                        <select id="chain" name="chain" required>
                            <option value="evm">EVM (Ethereum, BSC, Polygon...)</option>
                            <option value="btc">Bitcoin</option>
                            <option value="solana">Solana</option>
                            <option value="sui">Sui</option>
                            <option value="tron">Tron</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="address">Адрес кошелька</label>
                        <input type="text" id="address" name="address" placeholder="0x..." required>
                    </div>
                    
                    <button type="submit" class="btn" id="checkBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                        Проверить
                    </button>
                </form>

                <div class="error-message" id="errorMessage"></div>

                <div class="result" id="result">
                    <div class="result-header">
                        <span class="status-badge" id="statusBadge">-</span>
                        <span id="statusText">-</span>
                    </div>
                    <div class="result-details" id="resultDetails"></div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>
                    Купить проверки
                </h2>

                <div class="pricing-section">
                    <div class="form-group">
                        <label for="checksCount">Количество проверок</label>
                        <input type="number" id="checksCount" min="1" max="100" value="10">
                    </div>

                    <div class="pricing-grid" id="pricingGrid"></div>

                    <button class="btn" style="margin-top: 1rem;" id="buyBtn" onclick="showBuyModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        Купить
                    </button>
                </div>

                <div style="margin-top: 2rem;">
                    <h3 class="card-title" style="font-size: 1.1rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        Сообщить о кошельке
                    </h3>
                    
                    <form id="contactForm">
                        <div class="form-group">
                            <label for="contactName">Имя</label>
                            <input type="text" id="contactName" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="contactEmail">Email</label>
                            <input type="email" id="contactEmail" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="contactMessage">Сообщение</label>
                            <textarea id="contactMessage" name="message" required></textarea>
                        </div>
                        <button type="submit" class="btn">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            Отправить
                        </button>
                    </form>
                    <div class="contact-success" id="contactSuccess">
                        ✓ Сообщение отправлено! Мы свяжемся с вами.
                    </div>
                </div>
            </div>
        </div>

        <section class="recent-section">
            <h2 class="section-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                Последние угрозы
            </h2>
            <div class="recent-list" id="recentList"></div>
        </section>

        <footer class="footer">
            <p>Vauln Address API • Проверка кошельков • 2024</p>
        </footer>
    </div>

    <!-- Buy Modal -->
    <div class="modal" id="buyModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Оплата</h3>
                <button class="modal-close" onclick="closeBuyModal()">&times;</button>
            </div>
            <div id="buyModalContent"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let authToken = localStorage.getItem('authToken');
        let currentUser = null;
        let currentPricing = [];

        // Check if user is logged in
        function checkAuth() {
            if (authToken) {
                fetchUserProfile();
            }
        }

        async function fetchUserProfile() {
            try {
                const response = await fetch(API_BASE + '/user/profile', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                if (response.ok) {
                    const data = await response.json();
                    currentUser = data.user;
                    showUserPanel(data.user);
                } else {
                    logout();
                }
            } catch (error) {
                console.error('Failed to fetch profile:', error);
            }
        }

        function showUserPanel(user) {
            document.getElementById('userPanel').classList.add('show');
            document.getElementById('userAddress').textContent = user.wallet_address;
            document.getElementById('userChain').textContent = user.chain.toUpperCase();
            document.getElementById('userBalance').textContent = user.balance;
            document.getElementById('connectWalletBtn').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Отключить';
            document.getElementById('connectWalletBtn').onclick = logout;
        }

        function logout() {
            authToken = null;
            currentUser = null;
            localStorage.removeItem('authToken');
            document.getElementById('userPanel').classList.remove('show');
            document.getElementById('connectWalletBtn').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg> Подключить кошелек';
            document.getElementById('connectWalletBtn').onclick = connectWallet;
        }

        async function connectWallet() {
            if (window.ethereum) {
                try {
                    // Request account access
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const address = accounts[0];
                    const chain = 'evm';

                    // Get nonce from server
                    const nonceRes = await fetch(API_BASE + '/auth/nonce?address=' + address + '&chain=' + chain);
                    const nonceData = await nonceRes.json();

                    // Sign message
                    const message = nonceData.message;
                    const signature = await window.ethereum.request({
                        method: 'personal_sign',
                        params: [message, address]
                    });

                    // Authenticate
                    const authRes = await fetch(API_BASE + '/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ address, chain, signature, message })
                    });

                    if (authRes.ok) {
                        const authData = await authRes.json();
                        authToken = authData.token;
                        localStorage.setItem('authToken', authToken);
                        showUserPanel(authData.user);
                    } else {
                        const error = await authRes.json();
                        alert('Ошибка авторизации: ' + (error.details || error.error));
                    }
                } catch (error) {
                    console.error('Wallet connection error:', error);
                    alert('Ошибка подключения кошелька: ' + error.message);
                }
            } else {
                alert('Пожалуйста, установите MetaMask или другой Web3 кошелек');
            }
        }

        async function loadPricing() {
            const checks = document.getElementById('checksCount').value || 10;
            try {
                const response = await fetch(API_BASE + '/pricing?checks=' + checks);
                const data = await response.json();
                currentPricing = data.payment_methods;
                renderPricing(data);
            } catch (error) {
                console.error('Failed to load pricing:', error);
            }
        }

        function renderPricing(data) {
            const grid = document.getElementById('pricingGrid');
            grid.innerHTML = data.payment_methods.map(method => {
                const isSui = method.currency === 'sui';
                return '<div class="pricing-item' + (isSui ? ' sui' : '') + '">' +
                    '<div>' +
                        '<div class="pricing-currency">' + method.currency.toUpperCase() + '</div>' +
                        (isSui ? '<div class="pricing-discount">50% СКИДКА!</div>' : '') +
                    '</div>' +
                    '<div class="pricing-price">' +
                        '$' + method.price_usd.toFixed(2) +
                        (method.token_amount ? ' (' + method.token_amount.toFixed(4) + ' ' + method.currency.toUpperCase() + ')' : '') +
                        (isSui ? ' <span class="discount">BEST VALUE</span>' : '') +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function showBuyModal() {
            const modal = document.getElementById('buyModal');
            const content = document.getElementById('buyModalContent');
            
            if (!currentUser) {
                content.innerHTML = '<p style="color: var(--text-secondary);">Для покупки необходимо <a href="#" onclick="connectWallet(); closeBuyModal();" style="color: var(--accent);">подключить кошелек</a></p>';
            } else {
                content.innerHTML = currentPricing.map(method => {
                    const isSui = method.currency === 'sui';
                    return '<div class="pricing-item' + (isSui ? ' sui' : '') + '" style="margin-bottom: 0.5rem; cursor: pointer;" onclick="processPayment(\'' + method.currency + '\')">' +
                        '<div>' +
                            '<div class="pricing-currency">' + method.currency.toUpperCase() + '</div>' +
                        '</div>' +
                        '<div class="pricing-price">' +
                            '$' + method.price_usd.toFixed(2) +
                            (method.token_amount ? ' (' + method.token_amount.toFixed(4) + ' ' + method.currency.toUpperCase() + ')' : '') +
                        '</div>' +
                    '</div>';
                }).join('') + '<p style="margin-top: 1rem; color: var(--text-secondary); font-size: 0.85rem;">После оплаты нажмите "Проверить оплату" для активации проверок.</p><button class="btn btn-secondary" style="margin-top: 1rem;" onclick="verifyPayment()">Проверить оплату</button>';
            }
            
            modal.classList.add('show');
        }

        function closeBuyModal() {
            document.getElementById('buyModal').classList.remove('show');
        }

        async function processPayment(currency) {
            const checks = document.getElementById('checksCount').value || 10;
            
            try {
                const response = await fetch(API_BASE + '/orders', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + authToken
                    },
                    body: JSON.stringify({ checks_count: parseInt(checks), currency })
                });

                if (response.ok) {
                    const order = await response.json();
                    alert('Ордер создан! ID: ' + order.order_id + '\n\nОплатите ' + order.token_amount + ' ' + currency.toUpperCase() + ' на адрес:\n' + order.payment_address);
                    localStorage.setItem('lastOrderId', order.order_id);
                } else {
                    const error = await response.json();
                    alert('Ошибка: ' + (error.details || error.error));
                }
            } catch (error) {
                alert('Ошибка сети: ' + error.message);
            }
        }

        async function verifyPayment() {
            const orderId = localStorage.getItem('lastOrderId');
            if (!orderId) {
                alert('Сначала создайте ордер');
                return;
            }

            const txHash = prompt('Введите хеш транзакции (для демо можно ввести любой текст):');
            if (!txHash) return;

            try {
                const response = await fetch(API_BASE + '/orders/verify?order_id=' + orderId + '&tx_hash=' + txHash);
                
                if (response.ok) {
                    const result = await response.json();
                    alert('Оплата подтверждена! +' + result.checks_added + ' проверок');
                    localStorage.removeItem('lastOrderId');
                    closeBuyModal();
                    fetchUserProfile();
                } else {
                    const error = await response.json();
                    alert('Ошибка: ' + (error.details || error.error));
                }
            } catch (error) {
                alert('Ошибка сети: ' + error.message);
            }
        }

        async function loadRecentChecks() {
            try {
                const response = await fetch(API_BASE + '/recent');
                const data = await response.json();
                
                const recentList = document.getElementById('recentList');
                
                if (!data.checks || data.checks.length === 0) {
                    recentList.innerHTML = '<p style="color: var(--text-secondary);">Нет недавних проверок</p>';
                    return;
                }
                
                recentList.innerHTML = data.checks.map(check => {
                    const timeAgo = getTimeAgo(new Date(check.checked_at));
                    const chainLabel = check.chain.toUpperCase();
                    return '<div class="recent-item">' +
                        '<div class="recent-icon ' + check.status + '">' +
                            '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>' +
                        '</div>' +
                        '<div class="recent-info">' +
                            '<div class="recent-address">' + escapeHtml(check.address) + '</div>' +
                            '<div class="recent-meta">' + chainLabel + ' • ' + timeAgo + '</div>' +
                        '</div>' +
                        '<span class="recent-status ' + check.status + '">' + check.status + '</span>' +
                    '</div>';
                }).join('');
            } catch (error) {
                console.error('Failed to load recent checks:', error);
            }
        }

        function getTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            const intervals = { год: 31536000, месяц: 2592000, день: 86400, час: 3600, минута: 60 };
            for (const [name, secondsInUnit] of Object.entries(intervals)) {
                const interval = Math.floor(seconds / secondsInUnit);
                if (interval >= 1) return interval + ' ' + name + (interval > 1 && name !== 'минута' ? 'ов' : '') + ' назад';
            }
            return 'только что';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showResult(data) {
            const result = document.getElementById('result');
            const statusBadge = document.getElementById('statusBadge');
            const statusText = document.getElementById('statusText');
            const resultDetails = document.getElementById('resultDetails');
            const errorMessage = document.getElementById('errorMessage');
            
            errorMessage.classList.remove('show');
            result.classList.remove('show');
            
            setTimeout(() => {
                if (!data.found) {
                    statusBadge.className = 'status-badge status-not_found';
                    statusBadge.textContent = 'NOT FOUND';
                    statusText.textContent = 'Кошелек не найден в базе угроз';
                    resultDetails.innerHTML = 
                        '<div class="detail-item" style="grid-column: 1 / -1;"><div class="detail-label">Адрес</div><div class="detail-value">' + escapeHtml(data.address) + '</div></div>' +
                        '<div class="detail-item" style="grid-column: 1 / -1;"><div class="detail-label">Сеть</div><div class="detail-value">' + data.chain.toUpperCase() + '</div></div>';
                } else {
                    const statusClass = 'status-' + data.status;
                    statusBadge.className = 'status-badge ' + statusClass;
                    statusBadge.textContent = data.status;
                    
                    const statusDescriptions = {
                        hacked: 'Этот кошелек был взломан!',
                        vulnerable: 'Кошелек уязвим',
                        safe: 'Кошелек безопасен',
                        hacker: 'Известный адрес хакера',
                        drained: 'Средства были выведены'
                    };
                    statusText.textContent = statusDescriptions[data.status] || '';
                    
                    resultDetails.innerHTML = 
                        '<div class="detail-item"><div class="detail-label">Адрес</div><div class="detail-value">' + escapeHtml(data.address) + '</div></div>' +
                        '<div class="detail-item"><div class="detail-label">Сеть</div><div class="detail-value">' + data.chain.toUpperCase() + '</div></div>' +
                        '<div class="detail-item"><div class="detail-label">Приватный ключ</div><div class="detail-value ' + (data.has_pk ? 'yes' : 'no') + '">' + (data.has_pk ? 'Обнаружен' : 'Неизвестно') + '</div></div>' +
                        '<div class="detail-item"><div class="detail-label">Seed фраза</div><div class="detail-value ' + (data.has_seed ? 'yes' : 'no') + '">' + (data.has_seed ? 'Обнаружена' : 'Неизвестно') + '</div></div>';
                }
                
                if (data.balance_left !== undefined && data.balance_left >= 0) {
                    document.getElementById('userBalance').textContent = data.balance_left;
                }
                
                result.classList.add('show');
            }, 100);
        }

        function showError(message) {
            const errorMessage = document.getElementById('errorMessage');
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        document.getElementById('checkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('checkBtn');
            const address = document.getElementById('address').value.trim();
            const chain = document.getElementById('chain').value;
            
            if (!address) {
                showError('Пожалуйста, введите адрес кошелька');
                return;
            }
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Проверка...';
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('result').classList.remove('show');
            
            try {
                const headers = { 'Content-Type': 'application/json' };
                if (authToken) {
                    headers['Authorization'] = 'Bearer ' + authToken;
                }
                
                const response = await fetch(API_BASE + '/check', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ address, chain })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    showError(data.details || data.error || 'Произошла ошибка');
                    return;
                }
                
                showResult(data);
            } catch (error) {
                showError('Ошибка сети. Попробуйте позже.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg> Проверить';
            }
        });

        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const formData = {
                name: document.getElementById('contactName').value.trim(),
                email: document.getElementById('contactEmail').value.trim(),
                message: document.getElementById('contactMessage').value.trim()
            };
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Отправка...';
            
            try {
                const response = await fetch(API_BASE + '/contact', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    document.getElementById('contactSuccess').classList.add('show');
                    e.target.reset();
                    setTimeout(() => document.getElementById('contactSuccess').classList.remove('show'), 5000);
                } else {
                    const data = await response.json();
                    alert('Ошибка: ' + (data.error || 'Не удалось отправить сообщение'));
                }
            } catch (error) {
                alert('Ошибка сети. Попробуйте позже.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Отправить';
            }
        });

        document.getElementById('checksCount').addEventListener('change', loadPricing);

        // Initialize
        checkAuth();
        loadPricing();
        loadRecentChecks();
        setInterval(loadRecentChecks, 30000);

        // Listen for account changes
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', function(accounts) {
                if (accounts.length === 0) {
                    logout();
                } else {
                    connectWallet();
                }
            });
        }
    </script>
</body>
</html>
